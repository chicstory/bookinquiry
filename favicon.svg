<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Soft App Card Base -->
  <rect width="48" height="48" rx="12" fill="#FFFFFF"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Bunny Ears (Solid, Bold, Chunky with Rich Pink Inside) -->
  <!-- Left Ear -->
  <path d="M18 20C16 10 19 3.5 23 3.5C26 3.5 25 11 23 20" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M18.8 16.5C18.2 10.5 20 6.5 22 6.5C23 6.5 23 10.5 22 16.5" fill="#FDA4AF"/>
  
  <!-- Right Ear -->
  <path d="M30 20C32 10 29 3.5 25 3.5C22 3.5 23 11 25 20" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M29.2 16.5C29.8 10.5 28 6.5 26 6.5C25 6.5 25 10.5 26 16.5" fill="#FDA4AF"/>

  <!-- Bunny Head (Chunky solid outline) -->
  <circle cx="24" cy="23" r="11" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.6"/>

  <!-- Big Clear Eyes -->
  <circle cx="19.5" cy="21" r="1.8" fill="#0F172A"/>
  <circle cx="28.5" cy="21" r="1.8" fill="#0F172A"/>
  <circle cx="19" cy="20.5" r="0.6" fill="#FFFFFF"/>
  <circle cx="28" cy="20.5" r="0.6" fill="#FFFFFF"/>
  
  <!-- Pink Nose & Cheeks -->
  <ellipse cx="24" cy="23.5" rx="1.2" ry="0.9" fill="#F43F5E"/>
  <circle cx="16.5" cy="23.5" r="2.2" fill="#FECDD3"/>
  <circle cx="31.5" cy="23.5" r="2.2" fill="#FECDD3"/>

  <!-- Golden Compass -->
  <circle cx="24" cy="34" r="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2.5"/>
  <circle cx="24" cy="34" r="5.8" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.2"/>

  <!-- Compass Needle -->
  <g class="compass-needle" style="transform-origin: 24px 34px;">
    <polygon points="24,28.5 26.2,34 21.8,34" fill="#EF4444"/>
    <polygon points="24,39.5 26.2,34 21.8,34" fill="#3B82F6"/>
    <circle cx="24" cy="34" r="1.3" fill="#0F172A"/>
  </g>

  <!-- Paws holding compass -->
  <ellipse cx="16.5" cy="34" rx="2.4" ry="1.9" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.2"/>
  <ellipse cx="31.5" cy="34" rx="2.4" ry="1.9" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.2"/>

  <style>
    @keyframes needleWobble {
      0% { transform: rotate(0deg); }
      30% { transform: rotate(35deg); }
      60% { transform: rotate(-25deg); }
      80% { transform: rotate(15deg); }
      100% { transform: rotate(0deg); }
    }
    .compass-needle {
      transform-box: fill-box;
      transform-origin: center;
      animation: needleWobble 4s ease-in-out infinite alternate;
    }
  </style>
</svg>
