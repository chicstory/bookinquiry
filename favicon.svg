<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Rounded Squircle Canvas -->
  <rect width="32" height="32" rx="8" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" stroke="#E2E8F0" stroke-width="1"/>
  
  <!-- Minimal Capsule Bunny Body -->
  <path d="M10 13C10 9.68629 12.6863 7 16 7C19.3137 7 22 9.68629 22 13V18C22 21.3137 19.3137 24 16 24C12.6863 24 10 21.3137 10 18V13Z" fill="#3182F6" fill-opacity="0.12" stroke="#3182F6" stroke-width="2.2" stroke-linejoin="round"/>
  
  <!-- Bunny Left Ear -->
  <path d="M12.5 7V3.5C12.5 2.67157 13.1716 2 14 2C14.8284 2 15.5 2.67157 15.5 3.5V7" stroke="#3182F6" stroke-width="2.2" stroke-linecap="round"/>
  
  <!-- Bunny Right Ear -->
  <path d="M19.5 7V3.5C19.5 2.67157 18.8284 2 18 2C17.1716 2 16.5 2.67157 16.5 3.5V7" stroke="#3182F6" stroke-width="2.2" stroke-linecap="round"/>
  
  <!-- Golden Compass Ring -->
  <circle cx="16" cy="15.5" r="3.6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  
  <!-- Spinning Red Compass Needle -->
  <g class="spin-needle" style="transform-origin: 16px 15.5px;">
    <path d="M16 13.5L17.2 15.5L16 17.5L14.8 15.5Z" fill="#EF4444"/>
    <circle cx="16" cy="15.5" r="0.8" fill="#0F172A"/>
  </g>

  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      20% { transform: rotate(45deg); }
      45% { transform: rotate(-30deg); }
      70% { transform: rotate(15deg); }
      100% { transform: rotate(0deg); }
    }
    .spin-needle {
      transform-box: fill-box;
      transform-origin: center;
      animation: spin 5s ease-in-out infinite alternate;
    }
  </style>
</svg>
